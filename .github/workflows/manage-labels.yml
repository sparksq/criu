name: Remove labels
on: issue_comment

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-labels-on-comments:
    name: Remove labels on comments
    runs-on: ubuntu-24.04
    steps:
      - uses: mondeja/remove-labels-gh-action@b7118e4ba5dca74acf1059b3cb7660378ff9ab1a # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: |
            changes requested
            awaiting reply
